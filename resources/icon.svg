<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="CineTray">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#243b4a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4550"/>
      <stop offset="100%" stop-color="#2c343c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- tray -->
  <path fill="url(#panel)" d="M168 640c0-36 29-64 64-64h560c35 0 64 28 64 64v148c0 53-43 96-96 96H264c-53 0-96-43-96-96V640z"/>
  <path fill="#4a5560" d="M148 580c0-28 23-52 52-52h624c29 0 52 24 52 52v48H148v-48z"/>
  <rect x="148" y="608" width="728" height="18" rx="4" fill="#1c1c1e" opacity="0.28"/>

  <!-- clapperboard (incoming media) -->
  <g transform="translate(200 240) rotate(-10)">
    <rect x="0" y="88" width="280" height="220" rx="28" fill="#2c343c"/>
    <rect x="28" y="128" width="224" height="22" rx="8" fill="#8b949e"/>
    <rect x="28" y="172" width="180" height="18" rx="7" fill="#8b949e" opacity="0.65"/>
    <rect x="28" y="210" width="148" height="18" rx="7" fill="#8b949e" opacity="0.4"/>
    <!-- clap stick -->
    <path fill="#3a4550" d="M0 0h280v92H0z"/>
    <path fill="#f5f5f7" d="M0 0l56 92h56L56 0H0zm112 0l56 92h56L224 0H112zm168 0v92h-24L280 0z"/>
    <path fill="#1c1c1e" d="M56 0l56 92H56V0zm112 0l56 92h-56V0z"/>
    <!-- cyan accent stripe on body -->
    <rect x="28" y="250" width="96" height="28" rx="10" fill="#4cc2ff" opacity="0.9"/>
  </g>

  <!-- cyan arrow -->
  <path fill="#4cc2ff" filter="url(#glow)" d="M500 400h64l-8-26 72 48-72 48 8-26h-64z"/>

  <!-- film strip / reel into tidy folder -->
  <g transform="translate(580 250)">
    <!-- folder -->
    <path fill="url(#panel)" d="M48 64h220c26 0 48 22 48 48v240c0 26-22 48-48 48H48c-26 0-48-22-48-48V112c0-26 22-48 48-48z"/>
    <path fill="#4a5560" d="M48 64h78c12 0 20-10 20-22V28c0-12 10-22 22-22h42c26 0 48 22 48 48v10H48V64z"/>

    <!-- film frames inside folder -->
    <rect x="72" y="140" width="172" height="100" rx="14" fill="#1c1c1e" opacity="0.55"/>
    <rect x="88" y="156" width="48" height="68" rx="8" fill="#4cc2ff" opacity="0.85"/>
    <rect x="148" y="156" width="48" height="68" rx="8" fill="#8b949e" opacity="0.55"/>
    <rect x="208" y="156" width="20" height="68" rx="6" fill="#8b949e" opacity="0.3"/>
    <!-- sprocket holes -->
    <circle cx="80" cy="168" r="5" fill="#4a5560"/>
    <circle cx="80" cy="192" r="5" fill="#4a5560"/>
    <circle cx="80" cy="216" r="5" fill="#4a5560"/>
    <circle cx="236" cy="168" r="5" fill="#4a5560"/>
    <circle cx="236" cy="192" r="5" fill="#4a5560"/>
    <circle cx="236" cy="216" r="5" fill="#4a5560"/>

    <rect x="72" y="268" width="148" height="16" rx="6" fill="#8b949e" opacity="0.55"/>
    <rect x="72" y="300" width="110" height="16" rx="6" fill="#8b949e" opacity="0.35"/>

    <!-- check -->
    <circle cx="268" cy="72" r="42" fill="#4cc2ff" filter="url(#glow)"/>
    <path fill="none" stroke="#00344d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M250 74l14 14 30-32"/>
  </g>
</svg>
